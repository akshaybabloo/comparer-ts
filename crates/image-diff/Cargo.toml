[package]
name = "image-diff"
version = "0.1.0"
edition = "2024"
description = "Pixel-by-pixel image diffing with a perceptual tolerance, for comparer-ts"
repository = "https://github.com/akshaybabloo/comparer-ts"
license = "MIT"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }

# WebAssembly has no threads without nightly features, so bands are compared one after another there.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.12.0"
