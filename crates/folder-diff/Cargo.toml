[package]
name = "folder-diff"
version = "0.1.0"
edition = "2024"
description = "Folder comparison by content and metadata, for comparer-ts"
repository = "https://github.com/akshaybabloo/comparer-ts"
license = "MIT"

[features]
# (De)serialize the listing and result types, as comparer does to pass them through JSON.
serde = ["dep:serde"]
# Also generate TypeScript definitions for those types with ts-rs.
ts = ["serde", "dep:ts-rs"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
ts-rs = { version = "12.0.1", optional = true }
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

# WebAssembly has neither a filesystem nor threads without nightly features, so there the
# host lists the folders and hashes the files, and only the comparison itself runs here.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.12.0"

[dev-dependencies]
tempfile = "3.27.0"
