[package]
name = "comparer"
version = "0.2.0"
edition = "2024"
description = "Text, folder and image diffing, compiled to WebAssembly for comparer-ts"
repository = "https://github.com/akshaybabloo/comparer-ts"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
folder-diff = { version = "0.1.0", path = "../folder-diff", features = ["ts"] }
image-diff = { version = "0.1.0", path = "../image-diff" }
serde_json = "1.0.151"
text-diff = { version = "0.1.0", path = "../text-diff", features = ["ts"] }
wasm-bindgen = "0.2.128"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
