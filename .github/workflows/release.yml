name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      # Only needed so pnpm/action-setup can read the packageManager version.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: package
          path: package

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package version
        run: |
          set -euo pipefail
          tarball=$(ls package/*.tgz)
          version=$(tar -xOzf "$tarball" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match packaged version $version"
            exit 1
          fi
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"

      - name: Publish
        run: pnpm publish "$TARBALL" --access public --provenance --no-git-checks

  release:
    name: Release on GitHub
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
