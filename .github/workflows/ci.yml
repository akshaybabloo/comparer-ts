name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WASM_PACK_VERSION: "0.15.0"
  WASM_PACK_SHA256: "c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy rustfmt
          rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          set -euo pipefail
          name="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl"
          url="https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${name}.tar.gz"
          curl -fsSL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/wasm-pack.tar.gz" "$url"
          echo "${WASM_PACK_SHA256}  $RUNNER_TEMP/wasm-pack.tar.gz" | sha256sum --check --strict -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/wasm-pack.tar.gz" -C "$HOME/.local/bin" \
            --strip-components=1 --wildcards "*/wasm-pack"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2

      - name: Cache wasm-pack toolchain downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/.wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ env.WASM_PACK_VERSION }}

      - name: Verify tool versions
        run: |
          rustc --version
          cargo --version
          wasm-pack --version

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust
        run: cargo clippy --all-targets -- -D warnings

      # Also regenerates src/bindings, which the TypeScript build needs.
      - name: Test Rust
        run: cargo test

      # Produces crates/comparer/pkg, which src/index.ts imports.
      - name: Build wasm
        run: pnpm run build:wasm

      - name: Typecheck
        run: pnpm run typecheck

      - name: Check formatting
        run: pnpm exec prettier --check "src/**/*.{ts,js,json,css,md}" "*.{js,json,md}"

      - name: Test TypeScript
        run: pnpm run test:ts

      - name: Build
        run: pnpm exec vite build

      - name: Verify published package contents
        run: pnpm pack --pack-destination "$RUNNER_TEMP"
